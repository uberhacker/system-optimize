name: Tray app

# Tests and packages for the tray app, its GNOME Shell extension and the
# optional tuning agent (tray/, gnome-extension/, packaging/). The shell CLI
# has its own workflow (ci.yml). Read-only: nothing here can write to the
# repository.

on:
  push:
    paths:
      - 'tray/**'
      - 'gnome-extension/**'
      - 'packaging/**'
      - '.github/workflows/tray.yml'
  pull_request:
    paths:
      - 'tray/**'
      - 'gnome-extension/**'
      - 'packaging/**'
      - '.github/workflows/tray.yml'

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.qt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: PySide6
            pip: PySide6-Essentials==6.11.3
          - qt: PyQt6
            pip: PyQt6==6.11.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System libraries for offscreen Qt, shellcheck, desktop-file-utils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            shellcheck desktop-file-utils
      - name: Qt binding (pinned)
        run: python -m pip install '${{ matrix.pip }}'
      - name: Lint
        run: make -C tray lint
      - name: Unit tests and extension tests
        run: make -C tray test PYTHON=python
        env:
          SO_TRAY_QT: ${{ matrix.qt == 'PyQt6' && 'pyqt6' || 'pyside6' }}
      - name: No Qt at all (the backend, helper and agent must not need it)
        if: matrix.qt == 'PySide6'
        run: |
          python -m pip uninstall -y PySide6-Essentials shiboken6
          cd tray && python -m unittest discover -s tests
      - name: Screenshots
        if: matrix.qt == 'PySide6'
        run: |
          python -m pip install '${{ matrix.pip }}'
          make -C tray screenshots PYTHON=python
      - uses: actions/upload-artifact@v4
        if: matrix.qt == 'PySide6'
        with:
          name: screenshots
          path: tray/screenshots-out/

  rpm:
    name: RPM (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build tools
        run: dnf install -y -q rpm-build make python3 desktop-file-utils tar gzip
      - name: Build
        run: |
          mkdir -p rpmbuild/SOURCES
          packaging/make-tarball.sh rpmbuild/SOURCES
          rpmbuild --define "_topdir $PWD/rpmbuild" -ba packaging/rpm/system-optimize-tray.spec
      - name: Install the tray and agent packages (checks their dependencies resolve)
        run: |
          dnf install -y -q --setopt=install_weak_deps=False \
            rpmbuild/RPMS/noarch/system-optimize-tray-*.rpm rpmbuild/RPMS/noarch/system-optimize-agent-*.rpm
          system-optimize-tray-backend monitor | python3 -c 'import json, sys; json.load(sys.stdin)'
          system-optimize-agent --help >/dev/null
          test -x /usr/libexec/system-optimize/system-optimize-helper
          rpm -qpR rpmbuild/RPMS/noarch/gnome-shell-extension-system-optimize-*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: rpmbuild/RPMS/noarch/*.rpm

  deb:
    name: deb (Debian)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build tools
        run: |
          apt-get update -q
          apt-get install -y -q build-essential debhelper desktop-file-utils python3
      - name: Build
        run: |
          mkdir -p build
          tarball=$(packaging/make-tarball.sh build)
          tar -C build -xzf "$tarball"
          cd build/system-optimize-tray-*/
          cp -r packaging/debian debian
          dpkg-buildpackage -us -uc -b
      - name: Install the tray and agent packages (checks their dependencies resolve)
        run: |
          apt-get install -y -q --no-install-recommends \
            ./build/system-optimize-tray_*_all.deb ./build/system-optimize-agent_*_all.deb
          system-optimize-tray-backend monitor | python3 -c 'import json, sys; json.load(sys.stdin)'
          system-optimize-agent --help >/dev/null
          dpkg-deb -I build/gnome-shell-extension-system-optimize_*_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: build/*.deb
