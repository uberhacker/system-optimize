name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BATS_REPO: https://github.com/bats-core/bats-core.git
  BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5   # v1.14.0

jobs:
  lint:
    name: shellcheck and bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      # bash -n on every script, shellcheck -x on the sources, and a
      # single-file build that is shellchecked on its own.
      - run: tests/lint.sh

  unit:
    name: unit tests (bats, ${{ matrix.target }} build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [modular, bundle]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bats-core (pinned)
        run: |
          git init -q tests/vendor/bats-core
          git -C tests/vendor/bats-core fetch -q --depth 1 "$BATS_REPO" "$BATS_COMMIT"
          git -C tests/vendor/bats-core checkout -q FETCH_HEAD
      # The same suite runs against bin/ (modular) and against a fresh
      # single-file build (bundle): both must behave the same. Every test
      # runs against a fake machine under a temporary directory (SO_ROOT);
      # nothing on the runner is changed.
      - run: tests/run.sh
        env:
          BATS: ${{ github.workspace }}/tests/vendor/bats-core/bin/bats
          SO_TEST_TARGET: ${{ matrix.target }}

  bundle:
    name: single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh dist/system-optimize
      - name: The single file runs on its own
        run: |
          dist/system-optimize --version
          dist/system-optimize --help >/dev/null
          dist/system-optimize --completion bash >/dev/null
          dist/system-optimize --status
          dist/system-optimize --dry-run --yes
          (cd dist && sha256sum system-optimize | tee system-optimize.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: system-optimize-single-file
          path: |
            dist/system-optimize
            dist/system-optimize.sha256

  # install.sh and the installed program on the distributions it targets.
  # Inside each container --status and --dry-run read the real /proc, /sys
  # and /etc; then, as root, a real run with --force and its --undo, which
  # must leave /etc exactly as it was (the kernel, disk and CPU steps skip
  # themselves in a container, so only the container's files can change).
  # See tests/install-smoke.sh.
  install-smoke:
    name: install and run in ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        # The same distributions system-update is tested on.
        include:
          - { image: "ubuntu:24.04", pkg: apt }
          - { image: "debian:stable", pkg: apt }
          - { image: "fedora:latest", pkg: dnf }
          - { image: "rockylinux:9", pkg: dnf }
          - { image: "archlinux:latest", pkg: pacman }
          - { image: "opensuse/tumbleweed", pkg: zypper }
          - { image: "opensuse/leap", pkg: zypper }
          - { image: "alpine:latest", pkg: apk }
    container:
      image: ${{ matrix.image }}
    steps:
      # git first, so that actions/checkout clones instead of unpacking a
      # tarball with the image's tar; tests/bootstrap.sh does the rest.
      - name: Install git
        shell: sh
        run: |
          command -v git >/dev/null 2>&1 && exit 0
          if command -v apk >/dev/null; then apk add --no-cache git
          elif command -v dnf >/dev/null; then dnf install -y -q git-core
          elif command -v apt-get >/dev/null; then apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed git
          elif command -v zypper >/dev/null; then zypper -n install git-core
          fi
      - uses: actions/checkout@v4
      - name: Install bash and what the test needs
        shell: sh
        run: sh tests/bootstrap.sh
      - run: bash tests/install-smoke.sh
        env:
          SO_EXPECT_PKG: ${{ matrix.pkg }}
